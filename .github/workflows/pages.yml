name: Publish learning guide

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - artifacts/*.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble learning guide
        run: |
          mkdir -p _site/images
          cp docs/index.html _site/index.html
          cp artifacts/gameplay.png artifacts/gameplay-art-v1.png _site/images/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
